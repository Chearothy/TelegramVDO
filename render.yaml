services:
  - type: web
    name: telegram-vdo-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: TELEGRAM_CHANNEL_USERNAME
        value: rothy_video_library
      - key: ALLOWED_ORIGIN
        value: https://telegram-vdo.vercel.app
      - key: REFRESH_MINUTES
        value: "3"
      - key: FULL_SCAN_HOURS
        value: "6"
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_SESSION
        sync: false
